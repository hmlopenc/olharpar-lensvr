<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulador de Lentes · OlharPar</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  #inicio { display: grid; place-content: center; gap: 20px; height: 100%; padding: 24px; box-sizing: border-box;
            background: #10161c; text-align: center; overflow-y: auto; }
  #inicio[hidden], canvas[hidden] { display: none !important; }  /* o three.js põe display: block direto no canvas */
  h1 { margin: 0; font-size: 26px; font-weight: 600; }
  fieldset { display: grid; gap: 4px; margin: 0; padding: 12px 16px; border: 1px solid #33414e; border-radius: 12px; text-align: left; }
  legend { padding: 0 6px; color: #a9b7c4; font-size: 15px; }
  label { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 20px; }
  input[type=checkbox] { width: 26px; height: 26px; accent-color: #2f80ed; }
  button { font: inherit; font-weight: 600; min-height: 56px; padding: 16px 32px; border: 0; border-radius: 12px; background: #2f80ed; color: #fff; }
  .aviso { margin: 0; max-width: 22em; color: #a9b7c4; font-size: 15px; }
  #erro { margin: 0; max-width: 22em; color: #ff9b8f; }
  #teste { display: flex; align-items: center; min-height: 48px; margin: 0; font-size: 20px; }
  canvas { display: block; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }</script>
</head>
<body>
<main id="inicio">
  <h1>Simulador de Lentes</h1>
  <fieldset id="lentes">
    <legend>Lentes indicadas para o paciente (a catarata abre sempre)</legend>
    <label><input type="checkbox" value="monofocal" checked> Monofocal</label>
    <label><input type="checkbox" value="edof" checked> EDOF</label>
    <label><input type="checkbox" value="multifocal" checked> Multifocal</label>
    <label><input type="checkbox" value="torica" checked> Tórica</label>
    <label><input type="checkbox" value="monovisao" checked> Monovisão</label>
  </fieldset>
  <fieldset>
    <legend>Teste do controle</legend>
    <p id="teste">Ligue o controle no modo GAME e aperte um botão.</p>
  </fieldset>
  <button id="iniciar">Iniciar</button>
  <p id="erro" role="alert" hidden></p>
  <p class="aviso">Simulação ilustrativa. Os resultados variam de pessoa para pessoa.</p>
</main>
<script type="module">
import * as THREE from 'three';
import { montar } from './sequencia.js';

const PARAM_S = new URLSearchParams(location.search).get('s');  // ?s=2 encurta os capítulos para testar
const SEG = Number(PARAM_S) || 15;  // capítulo de foto; o de vídeo dura o vídeo

// WebXR nativo: no Chrome Android o Cardboard cuida da cabeça, do estéreo e da distorção das lentes do óculos.
const renderer = new THREE.WebGLRenderer();
renderer.setPixelRatio(devicePixelRatio);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
const canvas = renderer.domElement;
canvas.hidden = true;
document.body.append(canvas);
const inicio = document.querySelector('#inicio');

const cena = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
camera.layers.enable(1);          // fora do VR, a câmera mostra a malha do olho esquerdo
cena.add(camera);                 // o que é filho da câmera acompanha a cabeça
const mundo = new THREE.Group();  // gira para recentralizar
cena.add(mundo);

// Uma malha por olho: no VR o three.js mostra a camada 1 só ao olho esquerdo (OE) e a 2 só ao direito (OD).
const [oe, od] = [1, 2].map(camada => {
  const m = new THREE.Mesh(undefined, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
  m.layers.set(camada);
  mundo.add(m);
  return m;
});

// A imagem cobre 180° na vertical; o campo horizontal sai da proporção dela.
// Coluna u da imagem -> longitude (u - 0,5) * campo, com o centro em +x (frente), como no bake.py.
function mostrar(olho, tex) {
  const img = tex.image;
  const campo = Math.PI * (img.videoWidth || img.width) / (img.videoHeight || img.height);
  if (olho.userData.campo !== campo) {
    olho.geometry.dispose();
    olho.geometry = new THREE.SphereGeometry(10, 96, 64, Math.PI + campo / 2, -campo);
    olho.userData.campo = campo;
  }
  olho.material.map = tex;
  olho.material.needsUpdate = true;
  olho.visible = true;
}

// Texturas por URL (foto ou vídeo): o capítulo atual e o próximo ficam carregados, o resto é descartado (memória do celular).
const loader = new THREE.TextureLoader();
const cache = new Map();
function carregar(url) {
  if (!url.endsWith('.mp4')) return loader.loadAsync(url);
  const v = Object.assign(document.createElement('video'), { src: url, muted: true, loop: true, playsInline: true, preload: 'auto' });
  return new Promise((ok, falha) => {  // canplay volta a disparar a cada volta ao início: só o primeiro vale
    v.addEventListener('canplay', () => ok(new THREE.VideoTexture(v)), { once: true });
    v.onerror = falha;
  });
}
function pegar(url) {
  if (!cache.has(url)) cache.set(url, carregar(url).then(t => {
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }, () => { throw new Error(`o arquivo ${url} não carregou`); }));
  return cache.get(url);
}
function manter(urls) {
  for (const [url, t] of cache) if (!urls.includes(url)) {
    t.then(x => { if (x.isVideoTexture) { x.image.pause(); x.image.removeAttribute('src'); x.image.load(); } x.dispose(); }, () => {});
    cache.delete(url);
  }
}

// Legenda em 3D presa à cabeça (no VR não existe HTML sobreposto). Até duas linhas: a de cima menor.
const tela = Object.assign(document.createElement('canvas'), { width: 1024, height: 256 });
const ctx = tela.getContext('2d');
const texLegenda = new THREE.CanvasTexture(tela);
texLegenda.colorSpace = THREE.SRGBColorSpace;
const placa = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.4),
  new THREE.MeshBasicMaterial({ map: texLegenda, transparent: true, depthTest: false }));
placa.position.set(0, 0, -2.5);
placa.renderOrder = 1;
placa.visible = false;
camera.add(placa);

function legenda(cima, baixo) {
  ctx.clearRect(0, 0, tela.width, tela.height);
  if (cima || baixo) {
    ctx.fillStyle = 'rgba(0, 0, 0, .6)';
    ctx.beginPath();
    ctx.roundRect(0, 16, 1024, 224, 40);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 48px system-ui, sans-serif';
    ctx.fillText(cima ?? '', 512, 78, 960);
    ctx.font = '700 76px system-ui, sans-serif';
    ctx.fillText(baixo ?? '', 512, 166, 960);
  }
  texLegenda.needsUpdate = true;
  placa.visible = Boolean(cima || baixo);
}

// Controle Bluetooth no modo GAME (o SC-B03 do óculos): com o celular no óculos não há toque.
// O Chrome só mostra o controle à página depois do primeiro botão apertado.
const caixas = [...document.querySelectorAll('#lentes input')];
const marcadas = () => caixas.filter(c => c.checked).map(c => c.value);
function lerControle() {  // null sem controle; os botões 12 a 15 são o direcional no layout "standard"
  const g = [...navigator.getGamepads()].find(Boolean);
  if (!g) return null;
  const [x = 0, y = 0] = g.axes, ap = i => g.buttons[i]?.pressed;
  return {
    botao: g.buttons.some((b, i) => b.pressed && (i < 12 || i > 15)),
    seta: ap(12) || y < -0.5 ? '↑' : ap(13) || y > 0.5 ? '↓' : ap(14) || x < -0.5 ? '←' : ap(15) || x > 0.5 ? '→' : 'no centro',
  };
}

// Teste do controle na tela inicial, ao vivo: a funcionária confere antes de entregar o óculos.
const teste = document.querySelector('#teste');
(function testar() {
  const c = lerControle();
  const t = c ? `Controle conectado · botão ${c.botao ? 'apertado' : 'solto'} · joystick ${c.seta}`
              : 'Ligue o controle no modo GAME e aperte um botão.';
  if (!inicio.hidden && teste.textContent !== t) teste.textContent = t;
  requestAnimationFrame(testar);
})();

// Tela de preparo, presa à cabeça: o paciente encaixa o óculos, gira o ajuste dos olhos (distância pupilar)
// e o de foco olhando as letras, e começa com o botão do controle.
const telaPreparo = Object.assign(document.createElement('canvas'), { width: 1024, height: 1024 });
const cp = telaPreparo.getContext('2d');
cp.fillStyle = '#10161c';
cp.beginPath();
cp.roundRect(0, 0, 1024, 1024, 48);
cp.fill();
cp.fillStyle = '#fff';
cp.textAlign = 'center';
cp.textBaseline = 'middle';
cp.font = '700 64px system-ui, sans-serif';
cp.fillText('Ajuste o óculos', 512, 80);
cp.font = '500 38px system-ui, sans-serif';
['1. Encaixe no rosto e aperte as tiras.', '2. Gire o ajuste dos olhos até ver uma imagem só.',
  '3. Gire o foco até as letras menores ficarem nítidas.'].forEach((t, i) => cp.fillText(t, 512, 170 + 56 * i, 960));
let linha = 330;
for (const [px, letras] of [[64, 'Z H S'], [46, 'D K N V'], [34, 'C R O H S'], [26, 'N V Z D K O'], [20, 'H S R C Z N V'], [16, 'O K D V H R S Z']]) {
  linha += 2 * px;
  cp.font = `700 ${px}px system-ui, sans-serif`;
  cp.fillText(letras, 512, linha);
}
cp.fillStyle = '#2f80ed';
cp.beginPath();
cp.roundRect(192, 860, 640, 112, 28);
cp.fill();
cp.fillStyle = '#fff';
cp.font = '700 52px system-ui, sans-serif';
cp.fillText('Aperte o botão: Iniciar', 512, 916);
const texPreparo = new THREE.CanvasTexture(telaPreparo);
texPreparo.colorSpace = THREE.SRGBColorSpace;
const painel = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: texPreparo, depthTest: false }));  // ~44° a 2,5 m: letra grande para quem ainda tem catarata
painel.position.set(0, 0, -2.5);
painel.renderOrder = 1;
painel.visible = false;
camera.add(painel);

let preparo = false;  // tela de preparo à mostra, esperando o botão
let apertado = true;  // começa "apertado": um botão que já estava seguro não conta

function preparar() {
  rodada++;  // a sequência em andamento, se houver, para
  preparo = true;
  oe.visible = od.visible = false;  // fundo escuro, sem cena
  legenda();
  painel.visible = true;
  const [c] = montar(marcadas());
  pegar(c.od);
  pegar(c.oe);  // o primeiro capítulo carrega enquanto o paciente se ajusta
  document.body.dataset.preparo = '';  // ponto de observação do teste de fumaça
  delete document.body.dataset.capitulo;
}

function controle() {  // a cada quadro: no preparo, o botão começa a simulação
  const botao = lerControle()?.botao ?? false;
  if (preparo && botao && !apertado) {
    preparo = false;
    delete document.body.dataset.preparo;
    experiencia(montar(marcadas()), ++rodada, 0).catch(falhar);
  }
  apertado = botao;
}

const frente = new THREE.Vector3();
function recentralizar() {  // gira o mundo para que o centro da imagem (+x) fique na direção atual da cabeça
  camera.getWorldDirection(frente);
  mundo.rotation.y = Math.atan2(-frente.z, frente.x);
}

const temXR = await navigator.xr?.isSessionSupported('immersive-vr').catch(() => false) ?? false;
const espera = ms => new Promise(r => setTimeout(r, ms));
let trava = null;
let rodada = 0;  // muda a cada início e a cada parada: a sequência em andamento percebe e para

function ajustar() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}

function parar() {
  rodada++;
  renderer.setAnimationLoop(null);
  for (const o of [oe, od]) { o.material.map = null; o.visible = false; }
  manter([]);
  canvas.hidden = true;
  inicio.hidden = false;
  legenda();
  preparo = false;
  painel.visible = false;
  delete document.body.dataset.preparo;
  delete document.body.dataset.capitulo;
  trava?.release();
}

async function experiencia(caps, minha, contagem = 5) {  // contagem 0: com controle, o paciente já se ajustou no preparo
  const ativa = () => minha === rodada;
  for (const c of caps.slice(0, 1)) { pegar(c.od); pegar(c.oe); }  // carrega durante a contagem
  for (let n = contagem; n > 0 && ativa(); n--) { legenda('Encaixe o celular no óculos', String(n)); await espera(1000); }
  for (let i = 0; i < caps.length && ativa(); i++) {
    const c = caps[i], prox = caps[i + 1];
    const [tOD, tOE] = await Promise.all([pegar(c.od), pegar(c.oe)]);
    if (!ativa()) return;
    mostrar(od, tOD);
    mostrar(oe, tOE);
    const videos = [...new Set([tOD, tOE])].filter(t => t.isVideoTexture).map(t => t.image);
    for (const v of videos) v.currentTime = 0;
    await Promise.all(videos.map(v => v.play().catch(e => { if (ativa()) throw e; })));  // os dois olhos juntos (monovisão)
    if (!ativa()) return;  // a sequência pode ter parado enquanto o vídeo começava
    if (i === 0) { recentralizar(); painel.visible = false; }  // o preparo fica à mostra até a cena estar pronta
    manter([c.od, c.oe, prox?.od, prox?.oe]);
    if (prox) { pegar(prox.od); pegar(prox.oe); }
    document.body.dataset.capitulo = `${c.cena} · ${c.nome}`;  // ponto de observação do teste de fumaça
    legenda(c.cena, c.nome);
    const ms = videos.length && !PARAM_S ? videos[0].duration * 1000 : SEG * 1000;
    await espera(Math.min(3000, ms / 2));
    if (ativa()) legenda();
    await espera(ms - Math.min(3000, ms / 2));
  }
  if (!ativa()) return;
  if (lerControle()) return preparar();  // com controle, volta ao preparo: o paciente pode ver de novo
  if (renderer.xr.isPresenting) renderer.xr.getSession().end();  // o fim da sessão chama parar()
  else parar();
}

// No celular não há console: o motivo de uma falha aparece na tela inicial para a secretária repassar.
const erro = document.querySelector('#erro');
async function falhar(e) {
  if (renderer.xr.isPresenting) await renderer.xr.getSession().end().catch(() => {});
  parar();
  erro.textContent = `Não deu para continuar: ${e?.message || e?.type || e}`;
  erro.hidden = false;
}

document.querySelector('#iniciar').onclick = async () => {
  erro.hidden = true;
  try {
    const caps = montar(marcadas());
    if (temXR) {
      const sessao = await navigator.xr.requestSession('immersive-vr');
      renderer.xr.setFramebufferScaleFactor(XRWebGLLayer.getNativeFramebufferScaleFactor(sessao));  // nitidez: resolução nativa da tela
      await renderer.xr.setSession(sessao);
      sessao.addEventListener('end', parar);
    }
    trava = await navigator.wakeLock?.request('screen').catch(() => null);  // reforço: a tela não pode apagar no meio
    inicio.hidden = true;
    canvas.hidden = false;
    ajustar();
    renderer.setAnimationLoop(() => { controle(); renderer.render(cena, camera); });
    if (lerControle()) preparar();  // com controle: tela de preparo, e o paciente começa com o botão
    else await experiencia(caps, ++rodada);  // sem controle: contagem e começa sozinho
  } catch (e) {
    await falhar(e);
  }
};

addEventListener('resize', ajustar);
</script>
</body>
</html>
